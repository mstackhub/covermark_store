<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COVERMARK | ค้นหาสาขา Store Locator</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5">

  <link rel="icon" type="image/png" href="/favicon.png?v=5">
  <link rel="shortcut icon" href="/favicon.ico?v=5">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5">
  
  <!-- Typography (Google Fonts: Prompt & Inter for Premium Clean Aesthetics) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet.js Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    /* ==========================================================================
       1. CSS VARIABLES & THEME (COVERMARK BRAND CI #1D4A37)
       ========================================================================== */
    :root {
      --color-primary: #1d4a37;
      --color-primary-hover: #163a2b;
      --color-primary-soft: #eef3f0;

      --color-background: #ffffff;
      --color-surface: #ffffff;
      --color-surface-soft: #f7f8f7;

      --color-text-primary: #1f2421;
      --color-text-secondary: #667069;
      --color-text-muted: #8b938e;

      --color-border: #e3e7e4;
      --color-border-light: #f0f2f0;
      --color-success: #238636;

      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-full: 9999px;

      --shadow-subtle: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-hover: 0 4px 14px rgba(29, 74, 55, 0.08);
      --shadow-popup: 0 6px 20px rgba(0, 0, 0, 0.12);

      --font-family: 'Prompt', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --transition-fast: 0.18s ease;
      --transition-normal: 0.25s ease;
    }

    /* Reset & Base Styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--color-background);
      color: var(--color-text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      height: 100vh;
      overflow: hidden;
    }

    /* App Container Layout */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ==========================================================================
       2. SIDEBAR (DESKTOP: ~35-38%, SCROLLABLE)
       ========================================================================== */
    .sidebar {
      width: 420px;
      min-width: 380px;
      max-width: 480px;
      height: 100%;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      z-index: 20;
      position: relative;
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.02);
    }

    /* Header & Branding */
    .sidebar-header {
      padding: 24px 24px 16px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border-light);
    }

    .brand-logo-wrap {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }

    .brand-logo-img {
      height: 24px;
      width: auto;
      max-width: 210px;
      object-fit: contain;
      display: block;
    }

    .brand-title {
      display: none;
    }

    .brand-subtitle {
      font-size: 13px;
      font-weight: 400;
      color: var(--color-text-secondary);
      letter-spacing: 0.02em;
    }

    /* Search & Filter Controls */
    .controls-container {
      padding: 16px 24px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--color-text-muted);
      pointer-events: none;
      transition: color var(--transition-fast);
    }

    .search-input {
      width: 100%;
      height: 44px;
      padding: 0 40px 0 42px;
      font-family: var(--font-family);
      font-size: 14px;
      color: var(--color-text-primary);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .search-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(29, 74, 55, 0.10);
    }

    .search-input:focus + .search-icon {
      color: var(--color-primary);
    }

    .search-clear-btn {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      color: var(--color-text-muted);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }

    .search-clear-btn:hover {
      background: var(--color-surface-soft);
      color: var(--color-text-primary);
    }

    .search-hint {
      font-size: 12px;
      color: var(--color-text-muted);
      margin-top: -6px;
      padding-left: 4px;
      min-height: 18px;
    }

    .filters-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .custom-dropdown-wrap {
      position: relative;
    }

    .dropdown-trigger-btn {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-primary);
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      transition: all var(--transition-fast);
      user-select: none;
      outline: none;
    }

    .dropdown-trigger-btn:hover {
      border-color: #cbd5ce;
      background-color: #fafbfa;
    }

    /* Active / Selected Trigger Button (COVERMARK Green Background #1D4A37 + White Text) */
    .dropdown-trigger-btn.has-value,
    .dropdown-trigger-btn.is-open {
      background-color: var(--color-primary) !important;
      border-color: var(--color-primary) !important;
      color: #ffffff !important;
      box-shadow: 0 2px 8px rgba(29, 74, 55, 0.22);
    }

    .dropdown-trigger-btn.has-value .trigger-label,
    .dropdown-trigger-btn.is-open .trigger-label {
      color: #ffffff !important;
      font-weight: 600;
    }

    .dropdown-trigger-btn.has-value .select-chevron,
    .dropdown-trigger-btn.is-open .select-chevron {
      color: #ffffff !important;
    }

    .dropdown-trigger-btn.is-open .select-chevron {
      transform: rotate(180deg);
    }

    .trigger-content {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .trigger-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
      font-size: 13px;
    }

    .trigger-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
      color: #ffffff;
      line-height: 1;
      flex-shrink: 0;
    }

    .select-chevron {
      width: 14px;
      height: 14px;
      color: var(--color-text-muted);
      flex-shrink: 0;
      transition: transform var(--transition-fast), color var(--transition-fast);
    }

    /* Floating Dropdown Panel */
    .dropdown-panel {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 270px;
      max-width: 90vw;
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-popup);
      z-index: 100;
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: dropdownFadeIn 0.15s ease-out;
    }

    .custom-dropdown-wrap:nth-child(2) .dropdown-panel {
      right: 0;
      left: auto;
    }

    @keyframes dropdownFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dropdown-panel.show {
      display: flex;
    }

    .dropdown-panel-header {
      padding: 10px 12px;
      background: var(--color-surface-soft);
      border-bottom: 1px solid var(--color-border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-secondary);
    }

    .panel-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-link-action {
      background: none;
      border: none;
      font-family: var(--font-family);
      font-size: 11px;
      font-weight: 600;
      color: var(--color-primary);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      transition: background-color var(--transition-fast);
    }

    .btn-link-action:hover {
      background: var(--color-primary-soft);
    }

    .panel-actions .divider {
      color: var(--color-text-muted);
      font-size: 11px;
    }

    .dropdown-search-wrap {
      padding: 8px 10px;
      border-bottom: 1px solid var(--color-border-light);
    }

    .dropdown-search-input {
      width: 100%;
      height: 32px;
      padding: 0 10px;
      font-family: var(--font-family);
      font-size: 12px;
      color: var(--color-text-primary);
      background: var(--color-surface-soft);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      outline: none;
    }

    .dropdown-search-input:focus {
      border-color: var(--color-primary);
      background: #ffffff;
    }

    .dropdown-options-list {
      max-height: 240px;
      overflow-y: auto;
      padding: 4px 0;
    }

    .dropdown-options-list::-webkit-scrollbar {
      width: 5px;
    }
    .dropdown-options-list::-webkit-scrollbar-thumb {
      background: var(--color-border);
      border-radius: 4px;
    }

    .dropdown-option-item {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 13px;
      color: var(--color-text-primary);
      transition: background-color var(--transition-fast);
      user-select: none;
    }

    .dropdown-option-item:hover {
      background: var(--color-surface-soft);
    }

    .dropdown-option-item.selected {
      background: var(--color-primary-soft);
      color: var(--color-primary);
      font-weight: 600;
    }

    .option-checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .custom-checkbox {
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--color-border);
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }

    .dropdown-option-item.selected .custom-checkbox {
      background: var(--color-primary);
      border-color: var(--color-primary);
    }

    .custom-checkbox svg {
      width: 10px;
      height: 10px;
      stroke: #ffffff;
      display: none;
    }

    .dropdown-option-item.selected .custom-checkbox svg {
      display: block;
    }

    .option-label-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .option-count-pill {
      font-size: 11px;
      font-weight: 500;
      color: var(--color-text-muted);
      padding: 1px 6px;
      background: var(--color-surface-soft);
      border-radius: 999px;
      margin-left: 6px;
      flex-shrink: 0;
    }

    .dropdown-option-item.selected .option-count-pill {
      background: rgba(29, 74, 55, 0.12);
      color: var(--color-primary);
    }

    .option-empty-msg {
      padding: 16px 12px;
      font-size: 12px;
      color: var(--color-text-muted);
      text-align: center;
    }

    /* Mobile View Toggle Buttons */
    .mobile-view-toggle {
      display: none; /* hidden on desktop */
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--color-surface-soft);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-top: 4px;
    }

    .toggle-btn {
      padding: 8px 12px;
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--color-text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all var(--transition-fast);
    }

    .toggle-btn.active {
      background: var(--color-primary);
      color: #ffffff;
      box-shadow: var(--shadow-subtle);
    }

    /* Result Bar & Counter */
    .results-bar {
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--color-surface-soft);
      border-bottom: 1px solid var(--color-border-light);
    }

    .results-count-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-secondary);
    }

    .results-count-number {
      font-weight: 700;
      color: var(--color-primary);
    }

    .reset-filters-link {
      font-size: 12px;
      font-weight: 500;
      color: var(--color-primary);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      display: none;
    }

    .reset-filters-link:hover {
      color: var(--color-primary-hover);
    }

    /* Branch List Scroll Area */
    .branch-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .branch-list-container::-webkit-scrollbar {
      width: 6px;
    }
    .branch-list-container::-webkit-scrollbar-track {
      background: transparent;
    }
    .branch-list-container::-webkit-scrollbar-thumb {
      background: var(--color-border);
      border-radius: 4px;
    }
    .branch-list-container::-webkit-scrollbar-thumb:hover {
      background: var(--color-text-muted);
    }

    /* ==========================================================================
       3. BRANCH CARD COMPONENT (PREMIUM BEAUTY EDITORIAL STYLE)
       ========================================================================== */
    .branch-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      cursor: pointer;
      position: relative;
      transition: border-color var(--transition-fast), background-color var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .branch-card:hover {
      border-color: #cbd5ce;
      box-shadow: var(--shadow-hover);
      transform: translateY(-1px);
    }

    /* Active Selected Card State */
    .branch-card.is-active {
      border-left: 4px solid var(--color-primary) !important;
      border-color: #c2d6cc;
      background: var(--color-primary-soft);
      box-shadow: var(--shadow-hover);
    }

    .card-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .store-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      background-color: #DD9933;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.2;
      border-radius: 4px;
    }

    .branch-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-primary);
      line-height: 1.35;
      margin-top: 2px;
    }

    .branch-location {
      font-size: 13px;
      color: var(--color-text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .branch-phone-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-primary);
      margin-top: 2px;
    }

    .branch-phone-link {
      color: var(--color-primary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .branch-phone-link:hover {
      text-decoration: underline;
      color: var(--color-primary-hover);
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--color-border-light);
    }

    .btn-action {
      height: 36px;
      border-radius: var(--radius-sm);
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all var(--transition-fast);
      border: none;
    }

    .btn-call {
      background: #ffffff;
      border: 1px solid var(--color-primary);
      color: var(--color-primary);
    }

    .btn-call:hover {
      background: var(--color-primary-soft);
      border-color: var(--color-primary);
    }

    .btn-navigate {
      background: var(--color-primary);
      color: #ffffff;
    }

    .btn-navigate:hover {
      background: var(--color-primary-hover);
      color: #ffffff;
    }

    .btn-disabled {
      opacity: 0.45;
      pointer-events: none;
      cursor: not-allowed;
    }

    /* ==========================================================================
       4. EMPTY, SKELETON & ERROR STATES
       ========================================================================== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
      color: var(--color-text-secondary);
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      color: var(--color-text-muted);
      margin-bottom: 12px;
      opacity: 0.6;
    }

    .empty-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-bottom: 16px;
    }

    .btn-reset {
      padding: 8px 18px;
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-primary);
      background: var(--color-primary-soft);
      border: 1px solid rgba(29, 74, 55, 0.2);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .btn-reset:hover {
      background: var(--color-primary);
      color: #ffffff;
    }

    /* Skeleton Loading */
    .skeleton-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .skeleton-line {
      height: 12px;
      background: linear-gradient(90deg, #f0f2f0 25%, #e6eae7 50%, #f0f2f0 75%);
      background-size: 200% 100%;
      border-radius: 4px;
      animation: shimmer 1.5s infinite;
    }

    .skeleton-title {
      height: 18px;
      width: 70%;
    }

    .skeleton-subtitle {
      height: 12px;
      width: 45%;
    }

    .skeleton-actions {
      height: 34px;
      width: 100%;
      margin-top: 6px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Error Box */
    .error-box {
      margin: 20px;
      padding: 24px;
      background: #fdf5f5;
      border: 1px solid #fad2d2;
      border-radius: var(--radius-md);
      text-align: center;
      color: #b3261e;
    }

    .error-box p {
      font-size: 14px;
      line-height: 1.6;
    }

    .error-box button {
      margin-top: 14px;
      padding: 8px 20px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color var(--transition-fast);
    }

    .error-box button:hover {
      background: var(--color-primary-hover);
    }

    /* ==========================================================================
       5. MAP SECTION (DESKTOP: ~65% FULL HEIGHT)
       ========================================================================== */
    .map-container-wrap {
      flex: 1;
      height: 100%;
      position: relative;
      background: #f4f6f4;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    /* Custom Leaflet Markers */
    .custom-marker {
      background: transparent;
      border: none;
    }

    .marker-pin {
      width: 32px;
      height: 32px;
      background: #ffffff;
      border: 2.5px solid var(--color-primary);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
      transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .marker-pin::after {
      content: '';
      width: 10px;
      height: 10px;
      background: var(--color-primary);
      border-radius: 50%;
      transform: rotate(45deg);
      transition: background-color 0.2s ease;
    }

    .custom-marker:hover .marker-pin {
      transform: rotate(-45deg) scale(1.12);
      box-shadow: 0 6px 14px rgba(29, 74, 55, 0.3);
    }

    /* Selected Active Marker */
    .custom-marker.active-marker .marker-pin {
      background: var(--color-primary);
      border-color: #ffffff;
      transform: rotate(-45deg) scale(1.22);
      box-shadow: 0 8px 18px rgba(29, 74, 55, 0.45);
      z-index: 1000 !important;
    }

    .custom-marker.active-marker .marker-pin::after {
      background: #ffffff;
    }

    /* Custom Leaflet Popup */
    .leaflet-popup {
      margin-bottom: 20px;
    }

    .leaflet-popup-content-wrapper {
      padding: 0 !important;
      border-radius: var(--radius-md) !important;
      box-shadow: var(--shadow-popup) !important;
      border: 1px solid var(--color-border) !important;
      overflow: hidden !important;
      min-width: 220px !important;
      max-width: 280px !important;
    }

    .leaflet-popup-content {
      margin: 0 !important;
      min-width: 220px !important;
      max-width: 280px !important;
      width: 230px !important;
      line-height: 1.4;
      font-family: var(--font-family);
      box-sizing: border-box;
    }

    .popup-inner {
      padding: 14px 16px;
      width: 100%;
      box-sizing: border-box;
    }

    .popup-store {
      display: inline-block;
      padding: 2px 7px;
      background-color: #DD9933;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.2;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    .popup-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 4px;
      white-space: normal;
      word-break: break-word;
      line-height: 1.35;
    }

    .popup-desc {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-bottom: 12px;
      white-space: normal;
      word-break: break-word;
    }

    .leaflet-popup-content a.popup-btn-nav,
    .popup-btn-nav,
    .popup-btn-nav:visited,
    .popup-btn-nav:hover,
    .popup-btn-nav:active {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      height: 34px;
      background-color: var(--color-primary) !important;
      color: #ffffff !important;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      text-decoration: none !important;
      transition: background-color var(--transition-fast);
      box-sizing: border-box;
    }

    .leaflet-popup-content a.popup-btn-nav svg,
    .popup-btn-nav svg {
      stroke: #ffffff !important;
      color: #ffffff !important;
      fill: none;
      flex-shrink: 0;
    }

    .leaflet-popup-content a.popup-btn-nav:hover,
    .popup-btn-nav:hover {
      background-color: var(--color-primary-hover) !important;
      color: #ffffff !important;
    }

    /* Mobile Map Bottom Preview Card */
    .mobile-selected-card-bar {
      display: none;
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 30;
      background: #ffffff;
      border-radius: var(--radius-md);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      border: 1px solid var(--color-border);
      padding: 14px 16px;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* ==========================================================================
       6. RESPONSIVE BREAKPOINTS (<= 768px MOBILE & TABLET)
       ========================================================================== */
    @media (max-width: 768px) {
      html, body {
        height: auto !important;
        min-height: 100% !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
      }

      .app-container {
        flex-direction: column;
        height: auto !important;
        min-height: 100vh;
        overflow: visible !important;
      }

      .app-container.view-list {
        height: auto !important;
        overflow: visible !important;
      }

      .app-container.view-list .sidebar {
        display: flex;
        flex-direction: column;
        height: auto !important;
        overflow: visible !important;
        width: 100%;
        min-width: 100%;
        max-width: 100%;
        border-right: none;
        box-shadow: none;
      }

      .app-container.view-list .branch-list-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
        padding: 12px 16px 120px 16px !important; /* Bottom padding so last branch is never obscured */
      }

      .sidebar {
        width: 100%;
        min-width: 100%;

      .sidebar-header {
        padding: 16px 16px 10px;

      .map-container-wrap {

        background: #f4f6f4;
        display: none;
      }

      .app-container.view-list .map-container-wrap {
        display: none !important;
      }

      /* Fixed Full Screen Map View on Mobile */
      .app-container.view-map {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100vh !important;
        height: 100dvh !important;

      .app-container.view-map #map {

        position: absolute !important;

        bottom: 0;
        z-index: 10;
      }

      .app-container.view-map .mobile-selected-card-bar.has-selection {
        display: block;
      }
    }
  </style>
</head>

  <!-- Leaflet.js Map Library -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    /**
     * COVERMARK Store Locator - Turso Database Backend Integration
     */
    (function() {
      const state = {
        allBranches: [],
        filteredBranches: [],
        selectedBranchId: null,
        searchQuery: '',
        selectedProvinces: new Set(),
        selectedStores: new Set(),
        activeView: 'list',
        map: null,
        markersMap: new Map(),
        debounceTimer: null,
        provinceSearchQuery: '',
        storeSearchQuery: ''
      };

      const elements = {
        appContainer: document.getElementById('appContainer'),
        searchInput: document.getElementById('searchInput'),
        searchClearBtn: document.getElementById('searchClearBtn'),
        searchHint: document.getElementById('searchHint'),
        
        // Custom Dropdowns
        provinceDropdownWrap: document.getElementById('provinceDropdownWrap'),
        provinceDropdownBtn: document.getElementById('provinceDropdownBtn'),
        provinceTriggerLabel: document.getElementById('provinceTriggerLabel'),
        provinceBadge: document.getElementById('provinceBadge'),
        provinceDropdownPanel: document.getElementById('provinceDropdownPanel'),
        provinceSearchInput: document.getElementById('provinceSearchInput'),
        provinceOptionsList: document.getElementById('provinceOptionsList'),
        btnSelectAllProvinces: document.getElementById('btnSelectAllProvinces'),
        btnClearProvinces: document.getElementById('btnClearProvinces'),

        storeDropdownWrap: document.getElementById('storeDropdownWrap'),
        storeDropdownBtn: document.getElementById('storeDropdownBtn'),
        storeTriggerLabel: document.getElementById('storeTriggerLabel'),
        storeBadge: document.getElementById('storeBadge'),
        storeDropdownPanel: document.getElementById('storeDropdownPanel'),
        storeSearchInput: document.getElementById('storeSearchInput'),
        storeOptionsList: document.getElementById('storeOptionsList'),
        btnSelectAllStores: document.getElementById('btnSelectAllStores'),
        btnClearStores: document.getElementById('btnClearStores'),

        resultCounter: document.getElementById('resultCounter'),
        resetFiltersLink: document.getElementById('resetFiltersLink'),
        branchListContainer: document.getElementById('branchListContainer'),
        btnToggleList: document.getElementById('btnToggleList'),
        btnToggleMap: document.getElementById('btnToggleMap'),
        mobileSelectedCard: document.getElementById('mobileSelectedCard'),
        mobileCardContent: document.getElementById('mobileCardContent')
      };

      document.addEventListener('DOMContentLoaded', () => {
        initMap();
        initCustomDropdowns();
        bindEvents();
        fetchBranches();
      });

      function initMap() {
        state.map = L.map('map', {
          zoomControl: false,
          attributionControl: false
        }).setView([13.7563, 100.5018], 11);

        L.control.zoom({
          position: 'topright'
        }).addTo(state.map);

        L.control.attribution({
          position: 'bottomright',
          prefix: false
        }).addAttribution('&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions" target="_blank">CARTO</a>').addTo(state.map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
          maxZoom: 19,
          subdomains: 'abcd'
        }).addTo(state.map);
      }

      async function fetchBranches() {
        try {
          const response = await fetch('/api/branches');
          
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const json = await response.json();
          
          if (!json.success || !Array.isArray(json.data)) {
            throw new Error(json.message || 'Failed to load branches data');
          }

          onDataLoaded(json.data);
        } catch (error) {
          console.warn('API fetch failed or offline. Checking fallback...', error.message);
          
          if (location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
            console.info('Loading fallback COVERMARK dataset for preview.');
            onDataLoaded(getMockBranches());
          } else {
            onDataError(error);
          }
        }
      }

      function onDataLoaded(data) {
        state.allBranches = data.map(b => ({
          id: String(b.id || '').trim(),
          store: String(b.store || '').trim(),
          branchName: String(b.branchName || b.name || '').trim(),
          province: String(b.province || '').trim(),
          floor: b.floor ? String(b.floor).trim() : '',
          phone: b.phone ? String(b.phone).trim() : '',
          lat: b.lat !== null && b.lat !== '' && !isNaN(Number(b.lat)) ? Number(b.lat) : null,
          lng: (b.lng !== undefined && b.lng !== null && b.lng !== '' && !isNaN(Number(b.lng))) 
                ? Number(b.lng) 
                : (b.long !== undefined && b.long !== null && !isNaN(Number(b.long)) ? Number(b.long) : null),
          mapUrl: String(b.mapUrl || b.link || '').trim()
        })).filter(b => b.id && b.branchName);

        state.filteredBranches = [...state.allBranches];

        renderDropdownOptions();
        updateTriggerButtons();
        renderBranchList();
        renderMapMarkers();
        fitMapToMarkers();
      }

      function onDataError(err) {
        console.error('Data Error:', err);
        elements.resultCounter.textContent = 'เกิดข้อผิดพลาด';
        elements.branchListContainer.innerHTML = `
          <div class="error-box">
            <p>ไม่สามารถโหลดข้อมูลสาขาได้<br>กรุณาลองใหม่อีกครั้ง</p>
            <button type="button" onclick="location.reload()">ลองใหม่</button>
          </div>
        `;
      }

      // ==========================================================================
      // 2. CUSTOM MULTI-SELECT DROPDOWNS & CASCADING LOGIC
      // ==========================================================================
      function initCustomDropdowns() {
        // Toggle Province Dropdown Panel
        elements.provinceDropdownBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const isOpen = elements.provinceDropdownPanel.classList.contains('show');
          closeAllDropdowns();
          if (!isOpen) {
            elements.provinceDropdownPanel.classList.add('show');
            elements.provinceDropdownBtn.classList.add('is-open');
            elements.provinceDropdownBtn.setAttribute('aria-expanded', 'true');
            elements.provinceSearchInput.focus();
          }
        });

        // Toggle Store Dropdown Panel
        elements.storeDropdownBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const isOpen = elements.storeDropdownPanel.classList.contains('show');
          closeAllDropdowns();
          if (!isOpen) {
            elements.storeDropdownPanel.classList.add('show');
            elements.storeDropdownBtn.classList.add('is-open');
            elements.storeDropdownBtn.setAttribute('aria-expanded', 'true');
            elements.storeSearchInput.focus();
          }
        });

        // Prevent click inside panels from closing
        elements.provinceDropdownPanel.addEventListener('click', (e) => e.stopPropagation());
        elements.storeDropdownPanel.addEventListener('click', (e) => e.stopPropagation());

        // Close when clicking outside
        document.addEventListener('click', () => {
          closeAllDropdowns();
        });

        // Province Search inside Panel
        elements.provinceSearchInput.addEventListener('input', (e) => {
          state.provinceSearchQuery = e.target.value.trim().toLowerCase();
          renderProvinceOptionsList();
        });

        // Store Search inside Panel
        elements.storeSearchInput.addEventListener('input', (e) => {
          state.storeSearchQuery = e.target.value.trim().toLowerCase();
          renderStoreOptionsList();
        });

        // Action: Select All Provinces
        elements.btnSelectAllProvinces.addEventListener('click', () => {
          const available = getAvailableProvincesList();
          available.forEach(p => state.selectedProvinces.add(p.name));
          onFilterSelectionChanged();
        });

        // Action: Clear Provinces
        elements.btnClearProvinces.addEventListener('click', () => {
          state.selectedProvinces.clear();
          onFilterSelectionChanged();
        });

        // Action: Select All Stores
        elements.btnSelectAllStores.addEventListener('click', () => {
          const available = getAvailableStoresList();
          available.forEach(s => state.selectedStores.add(s.name));
          onFilterSelectionChanged();
        });

        // Action: Clear Stores
        elements.btnClearStores.addEventListener('click', () => {
          state.selectedStores.clear();
          onFilterSelectionChanged();
        });
      }

      function closeAllDropdowns() {
        elements.provinceDropdownPanel.classList.remove('show');
        elements.provinceDropdownBtn.classList.remove('is-open');
        elements.provinceDropdownBtn.setAttribute('aria-expanded', 'false');

        elements.storeDropdownPanel.classList.remove('show');
        elements.storeDropdownBtn.classList.remove('is-open');
        elements.storeDropdownBtn.setAttribute('aria-expanded', 'false');
      }

      /**
       * Compute available provinces based on currently selected stores (Cascading)
       */
      function getAvailableProvincesList() {
        // If stores are selected, consider branches belonging to selected stores
        const relevantBranches = state.selectedStores.size > 0
          ? state.allBranches.filter(b => state.selectedStores.has(b.store))
          : state.allBranches;

        const counts = {};
        relevantBranches.forEach(b => {
          const p = (b.province || '').trim();
          if (p && p !== '-' && p !== 'null') {
            counts[p] = (counts[p] || 0) + 1;
          }
        });

        return Object.keys(counts)
          .map(name => ({ name, count: counts[name] }))
          .sort((a, b) => a.name.localeCompare(b.name, 'th'));
      }

      /**
       * Compute available stores based on currently selected provinces (Cascading Relation)
       * E.g. If Bangkok is selected, only stores existing in Bangkok are returned!
       */
      function getAvailableStoresList() {
        // If provinces are selected, consider branches belonging to selected provinces
        const relevantBranches = state.selectedProvinces.size > 0
          ? state.allBranches.filter(b => state.selectedProvinces.has(b.province))
          : state.allBranches;

        const counts = {};
        relevantBranches.forEach(b => {
          const s = (b.store || '').trim();
          if (s && s !== '-' && s !== 'null') {
            counts[s] = (counts[s] || 0) + 1;
          }
        });

        return Object.keys(counts)
          .map(name => ({ name, count: counts[name] }))
          .sort((a, b) => a.name.localeCompare(b.name, 'th'));
      }

      function renderDropdownOptions() {
        // Clean any previously selected stores that are not in the newly available list
        const availStores = new Set(getAvailableStoresList().map(s => s.name));
        for (const s of state.selectedStores) {
          if (!availStores.has(s)) {
            state.selectedStores.delete(s);
          }
        }

        // Clean any previously selected provinces that are not in the newly available list
        const availProvinces = new Set(getAvailableProvincesList().map(p => p.name));
        for (const p of state.selectedProvinces) {
          if (!availProvinces.has(p)) {
            state.selectedProvinces.delete(p);
          }
        }

        renderProvinceOptionsList();
        renderStoreOptionsList();
      }

      function renderProvinceOptionsList() {
        const list = getAvailableProvincesList();
        const query = state.provinceSearchQuery;

        const filtered = query
          ? list.filter(item => item.name.toLowerCase().includes(query))
          : list;

        if (filtered.length === 0) {
          elements.provinceOptionsList.innerHTML = `<div class="option-empty-msg">ไม่พบจังหวัดที่ตรงกัน</div>`;
          return;
        }

        elements.provinceOptionsList.innerHTML = filtered.map(item => {
          const isSelected = state.selectedProvinces.has(item.name);
          return `
            <div class="dropdown-option-item ${isSelected ? 'selected' : ''}" onclick="window.toggleProvinceOption('${escapeHTML(item.name)}')">
              <div class="option-checkbox-wrap">
                <span class="custom-checkbox">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </span>
                <span class="option-label-text">${escapeHTML(item.name)}</span>
              </div>
              <span class="option-count-pill">${item.count}</span>
            </div>
          `;
        }).join('');
      }

      function renderStoreOptionsList() {
        const list = getAvailableStoresList();
        const query = state.storeSearchQuery;

        const filtered = query
          ? list.filter(item => item.name.toLowerCase().includes(query))
          : list;

        if (filtered.length === 0) {
          elements.storeOptionsList.innerHTML = `<div class="option-empty-msg">ไม่พบสาขา/ห้างในจังหวัดที่เลือก</div>`;
          return;
        }

        elements.storeOptionsList.innerHTML = filtered.map(item => {
          const isSelected = state.selectedStores.has(item.name);
          return `
            <div class="dropdown-option-item ${isSelected ? 'selected' : ''}" onclick="window.toggleStoreOption('${escapeHTML(item.name)}')">
              <div class="option-checkbox-wrap">
                <span class="custom-checkbox">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </span>
                <span class="option-label-text">${escapeHTML(item.name)}</span>
              </div>
              <span class="option-count-pill">${item.count}</span>
            </div>
          `;
        }).join('');
      }

      window.toggleProvinceOption = function(provinceName) {
        if (state.selectedProvinces.has(provinceName)) {
          state.selectedProvinces.delete(provinceName);
        } else {
          state.selectedProvinces.add(provinceName);
        }
        onFilterSelectionChanged();
      };

      window.toggleStoreOption = function(storeName) {
        if (state.selectedStores.has(storeName)) {
          state.selectedStores.delete(storeName);
        } else {
          state.selectedStores.add(storeName);
        }
        onFilterSelectionChanged();
      };

      function onFilterSelectionChanged() {
        renderDropdownOptions();
        updateTriggerButtons();
        applyFilters();
      }

      function updateTriggerButtons() {
        // Province Button Update
        const provCount = state.selectedProvinces.size;
        if (provCount === 0) {
          elements.provinceTriggerLabel.textContent = 'จังหวัดทั้งหมด';
          elements.provinceBadge.style.display = 'none';
          elements.provinceDropdownBtn.classList.remove('has-value');
        } else if (provCount === 1) {
          elements.provinceTriggerLabel.textContent = Array.from(state.selectedProvinces)[0];
          elements.provinceBadge.style.display = 'none';
          elements.provinceDropdownBtn.classList.add('has-value');
        } else {
          const first = Array.from(state.selectedProvinces)[0];
          elements.provinceTriggerLabel.textContent = `${first} +${provCount - 1}`;
          elements.provinceBadge.textContent = provCount;
          elements.provinceBadge.style.display = 'inline-flex';
          elements.provinceDropdownBtn.classList.add('has-value');
        }

        // Store Button Update
        const storeCount = state.selectedStores.size;
        if (storeCount === 0) {
          elements.storeTriggerLabel.textContent = 'สาขาทั้งหมด';
          elements.storeBadge.style.display = 'none';
          elements.storeDropdownBtn.classList.remove('has-value');
        } else if (storeCount === 1) {
          elements.storeTriggerLabel.textContent = Array.from(state.selectedStores)[0];
          elements.storeBadge.style.display = 'none';
          elements.storeDropdownBtn.classList.add('has-value');
        } else {
          const first = Array.from(state.selectedStores)[0];
          elements.storeTriggerLabel.textContent = `${first} +${storeCount - 1}`;
          elements.storeBadge.textContent = storeCount;
          elements.storeBadge.style.display = 'inline-flex';
          elements.storeDropdownBtn.classList.add('has-value');
        }
      }

      // ==========================================================================
      // 3. SEARCH & EVENTS
      // ==========================================================================
      function bindEvents() {
        elements.searchInput.addEventListener('input', (e) => {
          const val = e.target.value;
          elements.searchClearBtn.style.display = val.length > 0 ? 'flex' : 'none';

          clearTimeout(state.debounceTimer);
          state.debounceTimer = setTimeout(() => {
            handleSearchChange(val);
          }, 300);
        });

        elements.searchClearBtn.addEventListener('click', () => {
          elements.searchInput.value = '';
          elements.searchClearBtn.style.display = 'none';
          elements.searchHint.textContent = '';
          handleSearchChange('');
          elements.searchInput.focus();
        });

        elements.resetFiltersLink.addEventListener('click', resetAllFilters);

        elements.btnToggleList.addEventListener('click', () => setMobileView('list'));
        elements.btnToggleMap.addEventListener('click', () => setMobileView('map'));
      }

      function handleSearchChange(rawValue) {
        const query = rawValue.trim();

        if (query.length > 0 && query.length < 3) {
          elements.searchHint.textContent = 'พิมพ์อย่างน้อย 3 ตัวอักษรเพื่อค้นหา';
          state.searchQuery = '';
        } else {
          elements.searchHint.textContent = '';
          state.searchQuery = query;
        }

        applyFilters();
      }

      function applyFilters() {
        const queryLower = state.searchQuery.toLowerCase();

        state.filteredBranches = state.allBranches.filter(branch => {
          // Province Multi-select match
          if (state.selectedProvinces.size > 0 && !state.selectedProvinces.has(branch.province)) {
            return false;
          }

          // Store Multi-select match
          if (state.selectedStores.size > 0 && !state.selectedStores.has(branch.store)) {
            return false;
          }

          // Global Search (≥ 3 characters)
          if (queryLower) {
            const searchableText = [
              branch.id,
              branch.store,
              branch.branchName,
              branch.province,
              branch.floor,
              branch.phone
            ].filter(Boolean).join(' ').toLowerCase();

            if (!searchableText.includes(queryLower)) {
              return false;
            }
          }

          return true;
        });

        const hasActiveFilter = Boolean(state.searchQuery || state.selectedProvinces.size > 0 || state.selectedStores.size > 0);
        elements.resetFiltersLink.style.display = hasActiveFilter ? 'inline-block' : 'none';

        renderBranchList();
        renderMapMarkers();
        fitMapToMarkers();
      }

      function resetAllFilters() {
        elements.searchInput.value = '';
        elements.searchClearBtn.style.display = 'none';
        elements.searchHint.textContent = '';
        
        state.searchQuery = '';
        state.selectedProvinces.clear();
        state.selectedStores.clear();

        renderDropdownOptions();
        updateTriggerButtons();
        applyFilters();
      }

      function renderBranchList() {
        const total = state.filteredBranches.length;

        if (total > 0) {
          elements.resultCounter.innerHTML = `พบ <span class="results-count-number">${total}</span> สาขา`;
        } else {
          elements.resultCounter.innerHTML = `พบ <span class="results-count-number">0</span> สาขา`;
        }

        if (total === 0) {
          elements.branchListContainer.innerHTML = `
            <div class="empty-state">
              <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <div class="empty-title">ไม่พบสาขาที่ตรงกับการค้นหา</div>
              <div class="empty-desc">ลองเปลี่ยนคำค้นหา หรือเลือกจังหวัด/สาขาอื่น</div>
              <button type="button" class="btn-reset" onclick="document.getElementById('resetFiltersLink').click()">ล้างตัวกรอง</button>
            </div>
          `;
          return;
        }

        const html = state.filteredBranches.map(branch => createBranchCardHTML(branch)).join('');
        elements.branchListContainer.innerHTML = html;

        if (state.selectedBranchId) {
          highlightCard(state.selectedBranchId, false);
        }
      }

      function createBranchCardHTML(branch) {
        const isActive = branch.id === state.selectedBranchId;
        
        const locationParts = [];
        if (branch.province) locationParts.push(escapeHTML(branch.province));
        if (branch.floor) locationParts.push('ชั้น ' + escapeHTML(branch.floor));
        const locationStr = locationParts.join(' · ');

        const cleanPhone = (branch.phone || '').replace(/[^0-9+]/g, '');
        const phoneHTML = branch.phone ? `
          <div class="branch-phone-row">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            <a href="tel:${cleanPhone}" class="branch-phone-link" onclick="event.stopPropagation()">${escapeHTML(branch.phone)}</a>
          </div>
        ` : '';

        const callBtnHTML = cleanPhone ? `
          <a href="tel:${cleanPhone}" class="btn-action btn-call" aria-label="โทรหาสาขา ${escapeHTML(branch.branchName)}" onclick="event.stopPropagation()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            โทร
          </a>
        ` : `
          <button class="btn-action btn-call btn-disabled" disabled>โทร</button>
        `;

        const navBtnHTML = branch.mapUrl ? `
          <a href="${escapeHTML(branch.mapUrl)}" target="_blank" rel="noopener noreferrer" class="btn-action btn-navigate" aria-label="นำทางไปสาขา ${escapeHTML(branch.branchName)}" onclick="event.stopPropagation()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
            </svg>
            นำทาง
          </a>
        ` : `
          <button class="btn-action btn-navigate btn-disabled" disabled>นำทาง</button>
        `;

        return `
          <div class="branch-card ${isActive ? 'is-active' : ''}" id="card-${branch.id}" onclick="window.selectBranch('${branch.id}', true)">
            <div class="card-top-row">
              <span class="store-badge">${escapeHTML(branch.store || 'COVERMARK')}</span>
            </div>
            <div class="branch-name">${escapeHTML(branch.branchName)}</div>
            ${locationStr ? `<div class="branch-location">${locationStr}</div>` : ''}
            ${phoneHTML}
            <div class="card-actions">
              ${callBtnHTML}
              ${navBtnHTML}
            </div>
          </div>
        `;
      }

      function renderMapMarkers() {
        state.markersMap.forEach(marker => {
          state.map.removeLayer(marker);
        });
        state.markersMap.clear();

        state.filteredBranches.forEach(branch => {
          if (!isValidCoordinate(branch.lat, branch.lng)) {
            return;
          }

          const isSelected = branch.id === state.selectedBranchId;
          const markerIcon = createDivIcon(isSelected);

          const marker = L.marker([branch.lat, branch.lng], {
            icon: markerIcon,
            title: branch.branchName,
            riseOnHover: true
          });

          marker.bindPopup(createPopupHTML(branch), {
            offset: [0, -20],
            closeButton: false,
            minWidth: 230,
            maxWidth: 280,
            autoPanPadding: [20, 20]
          });

          marker.on('click', () => {
            selectBranch(branch.id, false);
          });

          marker.addTo(state.map);
          state.markersMap.set(branch.id, marker);
        });
      }

      function createDivIcon(isActive) {
        return L.divIcon({
          className: `custom-marker ${isActive ? 'active-marker' : ''}`,
          html: `<div class="marker-pin"></div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 32],
          popupAnchor: [0, -30]
        });
      }

      function createPopupHTML(branch) {
        const locationParts = [];
        if (branch.province) locationParts.push(escapeHTML(branch.province));
        if (branch.floor) locationParts.push('ชั้น ' + escapeHTML(branch.floor));
        const locationStr = locationParts.join(' · ');

        const navBtn = branch.mapUrl ? `
          <a href="${escapeHTML(branch.mapUrl)}" target="_blank" rel="noopener noreferrer" class="popup-btn-nav">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
            </svg>
            นำทาง
          </a>
        ` : '';

        return `
          <div class="popup-inner">
            <div class="popup-store">${escapeHTML(branch.store || 'COVERMARK')}</div>
            <div class="popup-title">${escapeHTML(branch.branchName)}</div>
            ${locationStr ? `<div class="popup-desc">${locationStr}</div>` : ''}
            ${navBtn}
          </div>
        `;
      }

      function fitMapToMarkers() {
        const validBranches = state.filteredBranches.filter(b => isValidCoordinate(b.lat, b.lng));
        
        if (validBranches.length === 0) {
          state.map.setView([13.7563, 100.5018], 11);
          return;
        }

        if (validBranches.length === 1) {
          state.map.setView([validBranches[0].lat, validBranches[0].lng], 16);
          return;
        }

        const bounds = L.latLngBounds(validBranches.map(b => [b.lat, b.lng]));
        state.map.fitBounds(bounds, {
          padding: [50, 50],
          maxZoom: 16
        });
      }

      window.selectBranch = function(branchId, shouldPanMap) {
        state.selectedBranchId = branchId;
        const branch = state.allBranches.find(b => b.id === branchId);
        if (!branch) return;

        highlightCard(branchId, true);
        updateActiveMarker(branchId);

        if (shouldPanMap && isValidCoordinate(branch.lat, branch.lng)) {
          state.map.flyTo([branch.lat, branch.lng], 16, {
            duration: 0.8
          });
          const marker = state.markersMap.get(branchId);
          if (marker) {
            setTimeout(() => {
              marker.openPopup();
            }, 300);
          }
        }

        updateMobilePreviewCard(branch);
      };

      function highlightCard(branchId, scrollIntoView) {
        document.querySelectorAll('.branch-card.is-active').forEach(card => {
          card.classList.remove('is-active');
        });

        const targetCard = document.getElementById(`card-${branchId}`);
        if (targetCard) {
          targetCard.classList.add('is-active');
          if (scrollIntoView) {
            targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        }
      }

      function updateActiveMarker(branchId) {
        state.markersMap.forEach((marker, id) => {
          const isTarget = id === branchId;
          marker.setIcon(createDivIcon(isTarget));
          if (isTarget) {
            marker.openPopup();
          }
        });
      }

      function updateMobilePreviewCard(branch) {
        const locationParts = [];
        if (branch.province) locationParts.push(escapeHTML(branch.province));
        if (branch.floor) locationParts.push('ชั้น ' + escapeHTML(branch.floor));
        const locationStr = locationParts.join(' · ');
        const cleanPhone = (branch.phone || '').replace(/[^0-9+]/g, '');

        elements.mobileCardContent.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
            <span style="display:inline-flex; align-items:center; padding:2px 7px; background-color:#DD9933; color:#ffffff; font-size:10px; font-weight:700; border-radius:4px; letter-spacing:0.06em; text-transform:uppercase; line-height:1.2;">
              ${escapeHTML(branch.store || 'COVERMARK')}
            </span>
            <button onclick="document.getElementById('mobileSelectedCard').classList.remove('has-selection')" style="background:none;border:none;color:var(--color-text-muted);cursor:pointer;font-size:14px;">
              ✕
            </button>
          </div>
          <div style="font-size:15px; font-weight:600; color:var(--color-text-primary); margin-bottom:2px;">
            ${escapeHTML(branch.branchName)}
          </div>
          <div style="font-size:12px; color:var(--color-text-secondary); margin-bottom:8px;">
            ${locationStr}
          </div>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
            ${cleanPhone ? `<a href="tel:${cleanPhone}" class="btn-action btn-call" style="height:32px;font-size:12px;">โทร</a>` : ''}
            ${branch.mapUrl ? `<a href="${escapeHTML(branch.mapUrl)}" target="_blank" class="btn-action btn-navigate" style="height:32px;font-size:12px;">นำทาง</a>` : ''}
          </div>
        `;

        elements.mobileSelectedCard.classList.add('has-selection');
      }

      function setMobileView(view) {
        state.activeView = view;
        if (view === 'map') {
          elements.appContainer.classList.remove('view-list');
          elements.appContainer.classList.add('view-map');
          elements.btnToggleMap.classList.add('active');
          elements.btnToggleList.classList.remove('active');

          // Invalidate Leaflet map size in multiple stages so tiles render immediately
          state.map.invalidateSize(true);
          requestAnimationFrame(() => {
            state.map.invalidateSize(true);
            if (state.selectedBranchId) {
              const b = state.allBranches.find(item => item.id === state.selectedBranchId);
              if (b && isValidCoordinate(b.lat, b.lng)) {
                state.map.setView([b.lat, b.lng], 16);
              }
            } else {
              fitMapToMarkers();
            }
          });
          setTimeout(() => {
            state.map.invalidateSize(true);
          }, 150);
          setTimeout(() => {
            state.map.invalidateSize(true);
          }, 400);
        } else {
          elements.appContainer.classList.remove('view-map');
          elements.appContainer.classList.add('view-list');
          elements.btnToggleList.classList.add('active');
          elements.btnToggleMap.classList.remove('active');
        }
      }

      window.addEventListener('resize', () => {
        if (state.map) {
          state.map.invalidateSize(true);
        }
      });

      function isValidCoordinate(lat, lng) {
        return lat !== null && lng !== null && lat !== '' && lng !== '' && !isNaN(Number(lat)) && !isNaN(Number(lng));
      }

      function escapeHTML(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }
